specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AgentRegistry
    network: base-sepolia
    source:
      address: "0x8715eD9A25bf7a681160120A9e1a76615E39B273"
      abi: AgentRegistry
      startBlock: 42505573
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Agent
        - CapabilityRequest
        - PaymentEvent
      abis:
        - name: AgentRegistry
          file: ./abis/AgentRegistry.json
      eventHandlers:
        - event: AgentRegistered(indexed bytes32,indexed address,string[],uint256,string,uint256)
          handler: handleAgentRegistered
        - event: AgentDeactivated(indexed bytes32,indexed address,uint256)
          handler: handleAgentDeactivated
        - event: AgentReactivated(indexed bytes32,indexed address,uint256)
          handler: handleAgentReactivated
        - event: TaskCompleted(indexed bytes32,indexed address,indexed address,uint256,uint256)
          handler: handleTaskCompleted
        - event: CapabilityRequested(string,uint256,indexed address,uint256)
          handler: handleCapabilityRequested
      file: ./src/agent-registry.ts
